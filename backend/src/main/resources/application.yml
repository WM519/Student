server:
  port: 8081

spring:
  application:
    name: student-leave
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接（请先执行 sql/init.sql）
    # 密码不写死在代码里：启动前设置 DB_PASSWORD 环境变量，或在 IDEA 的运行配置中填写
    url: jdbc:mysql://localhost:3306/student_leave?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# JWT 配置
jwt:
  # HS256 密钥（长度必须 ≥ 32 字节）；生产环境请通过 JWT_SECRET 环境变量覆盖
  secret: ${JWT_SECRET:StudentLeaveSystemJwtSecretKey2026@D:Date/student}
  # 令牌有效期（小时）
  expire-hours: 12

logging:
  level:
    com.leave: info
